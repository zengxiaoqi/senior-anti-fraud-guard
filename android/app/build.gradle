plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.antifraud.guard'
    compileSdk 33

    defaultConfig {
        applicationId "com.antifraud.guard"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1.0"
    }

    // 项目固定签名：debug 与 release 共用，保证任何包都能覆盖升级安装
    signingConfigs {
        appSign {
            // keystore 只存在于本地（不进版本库）；CI 上缺文件时不设置，
            // 避免构建阶段因找不到签名文件直接失败
            def ksFile = rootProject.file('keystore/guard-release.jks')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'guard123456'
                keyAlias 'guardkey'
                keyPassword 'guard123456'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = rootProject.file('keystore/guard-release.jks')
            if (ksFile.exists()) {
                signingConfig signingConfigs.appSign
            }
        }
        debug {
            // 使用 Android 默认 debug.keystore（本机与 CI 均自动生成），保证 CI 可构建
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}
