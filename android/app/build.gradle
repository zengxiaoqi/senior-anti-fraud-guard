plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 高德地图 key：配置在 local.properties（不进版本库），如 AMAP_KEY=xxxxxxxx
// 未配置时 App 自动回退到内置 WebView 瓦片地图，无需 key 也能用
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def amapKey = (localProps.getProperty('AMAP_KEY') ?: System.getenv('AMAP_KEY') ?: '').trim()

android {
    namespace 'com.antifraud.guard'
    compileSdk 33

    defaultConfig {
        applicationId "com.antifraud.guard"
        minSdk 26
        targetSdk 33
        versionCode 27
        versionName "1.7.15"

        // 高德原生 SDK 的 manifest key 占位 + 运行时开关
        manifestPlaceholders = [AMAP_API_KEY: amapKey]
        buildConfigField "String", "AMAP_KEY", "\"${amapKey}\""

        // 只保留真机 arm64 架构，去掉 x86_64(模拟器) 和 armeabi 重复旧架构，
        // 高德地图 so 库瘦身：55MB → 约 25MB
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // AGP 8 默认关闭 BuildConfig，这里显式开启（AMAP_KEY 走 BuildConfig 注入）
    buildFeatures {
        buildConfig true
    }

    // 项目固定签名：debug 与 release 共用，保证任何包都能覆盖升级安装
    signingConfigs {
        appSign {
            // keystore 只存在于本地（不进版本库）；CI 上缺文件时不设置，
            // 避免构建阶段因找不到签名文件直接失败
            def ksFile = rootProject.file('keystore/guard-release.jks')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'guard123456'
                keyAlias 'guardkey'
                keyPassword 'guard123456'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = rootProject.file('keystore/guard-release.jks')
            if (ksFile.exists()) {
                signingConfig signingConfigs.appSign
            }
        }
        debug {
            // 使用 Android 默认 debug.keystore（本机与 CI 均自动生成），保证 CI 可构建
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // 本地 JVM 单元测试：只跑与 Android 无关的纯逻辑（如定位权限版本矩阵、定位心跳策略）。
    // 这些逻辑以前是散在 Activity 里的 if/else，无法验证 —— 后台定位漏申请就是这么漏的。
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    // 高德 3D 地图原生 SDK（仅在配置了 AMAP_KEY 时由 TrackFragment 启用）
    implementation 'com.amap.api:3dmap:9.8.2'

    testImplementation 'junit:junit:4.13.2'
}
